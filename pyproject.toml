[project]
name = "movie-ec"
version = "0.1.0"
description = "映画館EC Webシステム（研究用サンプル）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "pydantic[email]==2.10.4",
    "bcrypt==4.2.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
