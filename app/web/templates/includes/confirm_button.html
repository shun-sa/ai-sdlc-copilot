{# trace: ADDR-010 #}
{# 確認ダイアログ付きの送信ボタン（UI-12、UI-15）。二重送信防止は共通の JavaScript で行う。 #}
<form method="post" action="{{ action }}" class="inline-form">
  {% csrf_token %}
  {% if hidden_name %}<input type="hidden" name="{{ hidden_name }}" value="{{ hidden_value }}">{% endif %}
  <button type="submit" data-confirm="{{ confirm_message }}" data-submit-once>{{ label }}</button>
</form>
