{% extends "web/base.html" %}
{% load display %}
{% block content %}
<form method="post" action="/login">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <p>
    <label for="email">メールアドレス</label><span class="required-label">必須</span><br>
    <input id="email" type="text" name="email" value="{{ form.email }}" maxlength="254">
    {% for reason in details|field_errors:"email" %}<span class="field-error">{{ reason }}</span>{% endfor %}
  </p>
  <p>
    <label for="password">パスワード</label><span class="required-label">必須</span><br>
    <input id="password" type="password" name="password">
    {% for reason in details|field_errors:"password" %}<span class="field-error">{{ reason }}</span>{% endfor %}
  </p>
  <button type="submit" data-submit-once="true">ログイン</button>
</form>
<p><a href="/register">会員登録はこちら</a></p>
{% endblock %}
