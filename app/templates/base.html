<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}映画館EC{% endblock %}</title>
</head>
<body>
  <header>
    <nav>
      <a href="/">映画館EC</a>
      <form action="/movies" method="get" style="display:inline">
        <input type="text" name="keyword" placeholder="映画を検索">
        <button type="submit">検索</button>
      </form>
      <a href="/products">商品一覧</a>
      {% if current_user %}
        <span>{{ current_user.name }} さん</span>
        <a href="/cart">カート</a>
        <a href="/history">購入履歴</a>
        <form action="/logout" method="post" style="display:inline">
          <button type="submit">ログアウト</button>
        </form>
      {% else %}
        <a href="/login">ログイン</a>
        <a href="/register">会員登録</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if error_message %}
      <p role="alert" class="error">{{ error_message }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
