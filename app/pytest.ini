[pytest]
# 自動テストは app/tests/ に置く（Steering 4章：アプリケーション（画面・API・業務処理・テスト）は app/ に配置）。
# 単体テストは tests/unit/、結合テストは tests/integration/。
# 実行：app/ で `python -m pytest`、app コンテナで `docker compose exec app pytest`（compose.yaml が app/tests・本ファイルをマウントする）。
# リポジトリ直下から実行する場合（JUnit を追跡監査に使う場合を含む）は、単体・結合とも rootdir をリポジトリ直下に揃える：
#   python -m pytest -c app/pytest.ini --rootdir=. app/tests/unit        （結合テストは app/tests/integration）
#   rootdir をリポジトリ直下にすると JUnit の classname が app.tests.unit.test_xxx（テストファイルのパスと一致）となり、
#   trace_check.py がテストファイル app/tests/unit/test_xxx.py と照合できる。pythonpath（下記）は本ファイルのある app/ を基準に
#   解決されるため、tests.settings_test・各アプリのモジュールの import は rootdir に依らず同じ。
# 試験設定（tests/settings_test.py）は MINICOMMERCE_ENV=development と開発用機能フラグ true を明示し、
# 接続先 DB は環境変数 DB_HOST・DB_PORT・DB_NAME・DB_USER・DB_PASSWORD で与える（ADDR-011 DD-006、ADDR-014 DD-007）。
# pytest-django が test_ で始まる使い捨ての試験用データベースを作成・破棄する（PostgreSQL 16 のみ）。
pythonpath = .
testpaths = tests/unit tests/integration
DJANGO_SETTINGS_MODULE = tests.settings_test
django_find_project = false
python_files = test_*.py
addopts = -ra --strict-markers
