# 単体テストの網羅率計測の設定（coverage.py / pytest-cov）。実験Run RUN-AOBA-EC-1118 の計測前に固定する。
# 計測対象：app/ 配下の Production Code（分岐計測を有効化）。
# 除外：テストコード（app/tests/）、マイグレーション（宣言的なスキーマ定義）、プロセス起動点・サーバー設定（app/manage.py・app/gunicorn.conf.py：
# 業務ロジックを持たず単体テストの対象外）。計測データは試行ごとに pytest-cov が消去してから新規に作る。
[run]
branch = True
source = app
omit =
    */app/tests/*
    */migrations/*
    */app/manage.py
    */app/gunicorn.conf.py
data_file = reports/unit-test/.coverage

[report]
show_missing = True
skip_empty = False

[json]
pretty_print = True
