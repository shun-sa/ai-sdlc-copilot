[project]
name = "minicommerce"
version = "1.0.0"
description = "MiniCommerce（会員向け自社ECサイト）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B904"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["accounts", "catalog", "carts", "orders", "payments", "seeding", "web", "../tests"]
